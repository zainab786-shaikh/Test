<div class="page-container">
  
  <header class="page-header">
    <div class="header-content">
      <button (click)="goBack()" class="btn-ghost back-btn">
        <mat-icon>arrow_back</mat-icon> Back
      </button>
      <div class="title-container">
        <h1>College Semesters</h1>
        <p class="subtitle">Manage academic semesters and branches</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-primary" (click)="toggleForm()">
        <mat-icon>{{ isFormVisible ? 'close' : 'add' }}</mat-icon>
        <span>{{ isFormVisible ? 'Cancel' : 'New Semester' }}</span>
      </button>
    </div>
  </header>

  
  <main class="page-content">
    
    
    <div class="section-card form-section" *ngIf="isFormVisible">
      <div class="section-header">
        <div class="section-title">
          <div class="icon-wrapper">
            <mat-icon>school</mat-icon>
          </div>
          <h2>Add College Semester</h2>
        </div>
      </div>
      
      <div class="section-content">
        <form [formGroup]="schoolstandardForm" (ngSubmit)="onSubmit()" class="modern-form">
          <div class="form-grid">
            <div class="form-group">
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Select Semester</mat-label>
                <mat-select formControlName="standard" required>
                  <mat-option *ngFor="let standard of standardList" [value]="standard.Id">
                    {{ standard.name }}
                  </mat-option>
                </mat-select>
                <mat-error *ngIf="getErrorMessages('standard').length > 0">
                  {{ getErrorMessages("standard")[0] }}
                </mat-error>
              </mat-form-field>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn-secondary" (click)="toggleForm()">Cancel</button>
            <button type="submit" class="btn-primary submit-btn" [disabled]="schoolstandardForm.invalid">
              Add Semester
            </button>
          </div>
        </form>
      </div>
    </div>

    
    <div class="section-card table-section">
      <div class="section-header">
        <div class="section-title">
          <h2>Registered Semesters</h2>
          <span class="badge" *ngIf="dataSource">{{ dataSource.length || 0 }}</span>
        </div>
      </div>

      <div class="table-container">
        <table mat-table [dataSource]="dataSource" class="modern-table">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let element">
               <div class="cell-content primary-cell">{{ element.name }}</div>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="actions-header">Actions</th>
            <td mat-cell *matCellDef="let element" class="actions-cell">
              <div class="action-buttons">
                
                <button class="action-btn delete-btn" (click)="deleteSchoolStandard(element.Id)" matTooltip="Delete Semester">
                  <mat-icon>delete</mat-icon>
                </button>

                <button class="action-btn list-btn" (click)="onStudents(element.Id, element.standard)" matTooltip="List Students">
                  <mat-icon>people</mat-icon>
                </button>

                <button class="action-btn list-btn" (click)="onTeachers(element.Id, element.standard)" matTooltip="List Teachers">
                  <mat-icon>person_4</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns" class="modern-row"></tr>
        </table>
      </div>
    </div>
  </main>
</div>
