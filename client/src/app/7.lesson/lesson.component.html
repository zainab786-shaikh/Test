<div class="page-container">
  <header class="page-header">
    <div class="header-content">
      <div class="title-container">
        <h1>Lesson Details</h1>
        <p class="subtitle">Manage subject lessons</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-primary" (click)="toggleForm()">
        <mat-icon>{{ isFormVisible ? 'close' : 'add' }}</mat-icon>
        <span>{{ isFormVisible ? 'Cancel' : 'New Lesson' }}</span>
      </button>
    </div>
  </header>

  <main class="page-content">
    
    <div class="section-card form-section" *ngIf="isFormVisible">
      <div class="section-header">
        <div class="section-title">
          <div class="icon-wrapper">
            <mat-icon>{{ isEditMode ? "edit" : "add" }}</mat-icon>
          </div>
          <h2>{{ isEditMode ? "Update Lesson" : "Add Lesson" }}</h2>
        </div>
      </div>
      
      <div class="section-content">
        <form [formGroup]="lessonForm" (ngSubmit)="onSubmit()" class="modern-form">
          <div class="form-grid">
            <div class="form-group">
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Name</mat-label>
                <input matInput formControlName="name" />
                <mat-error *ngFor="let error of getErrorMessages('Name')">{{ error }}</mat-error>
              </mat-form-field>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn-secondary" (click)="toggleForm()">Cancel</button>
            <button type="submit" class="btn-primary submit-btn" [disabled]="lessonForm.invalid">
              {{ isEditMode ? "Update" : "Add" }}
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="section-card table-section">
      <div class="section-header">
        <div class="section-title">
          <h2>Registered Lessons</h2>
          <span class="badge" *ngIf="dataSource">{{ dataSource.length || 0 }}</span>
        </div>
      </div>

      <div class="table-container">
        <table mat-table [dataSource]="dataSource" class="modern-table">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let element">
               <div class="cell-content primary-cell">{{ element.name }}</div>
            </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="actions-header">Actions</th>
            <td mat-cell *matCellDef="let element" class="actions-cell">
              <div class="action-buttons">
                <button class="action-btn edit-btn" (click)="editLesson(element)" matTooltip="Edit">
                  <mat-icon>edit</mat-icon>
                </button>
                <button class="action-btn delete-btn" (click)="deleteLesson(element.Id)" matTooltip="Delete">
                  <mat-icon>delete</mat-icon>
                </button>
                <button class="action-btn list-btn" (click)="onLessonSections(element.Id)" matTooltip="Lesson Sections">
                  <mat-icon>list_alt</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns" class="modern-row"></tr>
        </table>
      </div>
    </div>
  </main>
</div>
