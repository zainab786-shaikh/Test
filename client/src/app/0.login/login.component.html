<div class="auth-page">
  <div class="auth-container">
    <div class="auth-brand">
      <div class="logo-box">
        <mat-icon>school</mat-icon>
      </div>
      <h1 class="app-name">LearnZy</h1>
    </div>

    <div class="auth-card">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Username</mat-label>
            <input matInput type="text" formControlName="username" required />
            <mat-icon matSuffix class="field-icon">person</mat-icon>
            <mat-error *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
              Username is required
            </mat-error>
          </mat-form-field>
        </div>

        <div class="form-group">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" required
              (input)="onPasswordInput($event)" />
            <button mat-icon-button matSuffix *ngIf="showVisibilityIcon" (click)="hidePassword = !hidePassword"
              [attr.aria-label]="'Toggle password visibility'" type="button">
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
              Password is required
            </mat-error>
          </mat-form-field>
        </div>

        <!-- Forgot Password Link -->
        <div class="forgot-password" style="display: none;">
          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-primary auth-submit" [disabled]="loginForm.invalid">
          <span>Sign Into Account</span>
          <mat-icon>arrow_forward</mat-icon>
        </button>

        <div *ngIf="errorMessage" class="error-alert">
          <mat-icon>error_outline</mat-icon>
          <span>{{ errorMessage }}</span>
        </div>
      </form>
    </div>


    <div class="demo-section">
      <p>Quick Access Demo Roles:</p>
      <div class="demo-roles">
        <button class="btn-demo" (click)="fillDemoCredentials('admin')" type="button">Admin</button>
        <button class="btn-demo" (click)="fillDemoCredentials('teacher')" type="button">Teacher</button>
        <button class="btn-demo" (click)="fillDemoCredentials('student')" type="button">Student</button>
      </div>
    </div>
  </div>
</div>
