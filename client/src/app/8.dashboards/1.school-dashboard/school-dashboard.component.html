<div class="dashboard-container">
  <header class="dashboard-header">
    <div class="header-content">
      <div class="title-container">
        <h1>Teacher Dashboard</h1>
        <p class="subtitle">Monitor student performance at a glance</p>
      </div>
    </div>
    <div class="header-actions">
      <button (click)="logout()" class="logout-button">
        <span class="logout-icon">←</span> Logout
      </button>
    </div>
  </header>

  <section class="overall-performance">
    <div class="section-card">
      <div class="section-header">
        <div class="section-title">
          <div class="icon-badge chart-icon">
            <span class="badge-icon">📊</span>
          </div>
          <h2>Overall Performance</h2>
        </div>
      </div>
      <div class="section-content chart-content">
        <plotly-plot
          *ngIf="perfOverallPlotter"
          [data]="perfOverallPlotter.barData"
          [layout]="perfOverallPlotter.barLayout"
        ></plotly-plot>
      </div>
    </div>
  </section>

  <section class="progress-cards">
    <div class="section-card">
      <div class="section-header">
        <div class="section-title">
          <div class="icon-badge semester-icon">
            <span class="badge-icon">🎓</span>
          </div>
          <h2>Progress by Semester</h2>
        </div>
      </div>
      <div class="section-content">
        <app-progress-bar
          [parentList]="perfPerStandard"
          (onParentClick)="clickByStandard($event)"
        ></app-progress-bar>
      </div>
    </div>

    <div class="section-card">
      <div class="section-header">
        <div class="section-title">
          <div class="icon-badge subject-icon">
            <span class="badge-icon">📚</span>
          </div>
          <h2>Progress by Subject</h2>
        </div>
      </div>
      <div class="section-content">
        <app-progress-bar
          [parentList]="perfPerSubject"
          (onParentClick)="clickBySubject($event)"
        ></app-progress-bar>
      </div>
    </div>
  </section>
</div>
